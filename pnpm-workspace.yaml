overrides:
  # 2026-10-01 audit: 새로 공개된 권고 해소용 하한
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
  'postcss-selector-parser@>=6.1.0 <6.1.3': '>=6.1.3'
  '@babel/core': 7.29.6
  postcss: '>=8.5.23'
  tmp: ^0.2.7
  i18next-fs-backend: '>=2.6.6'
  # dev 전용 전이 의존성 취약점 정리(2026-07 audit — prod 영향 없음)
  'undici@>=7.0.0 <7.28.0': '>=7.28.0'
  # ws 소비처(jsdom·puppeteer·webpack-bundle-analyzer)는 전부 8.x — 블랭킷으로 통일
  ws: '>=8.21.0'
  'form-data@>=4.0.0 <4.0.6': '>=4.0.6'
  'js-yaml@<3.15.0': '>=3.15.0 <4'
  'js-yaml@>=4.0.0 <=4.1.1': '>=4.1.2'

confirmModulesPurge: false

allowBuilds:
  '@swc/core': true
  core-js: false
  esbuild: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8
